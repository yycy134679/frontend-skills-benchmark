<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>独立成品 · 示意页面</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#27313e;font:16px/1.6 system-ui}a{color:inherit;text-decoration:none}button{cursor:pointer;font:inherit;padding:10px 22px;background:#27313e;border:0;color:white;border-radius:8px}a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #c15125;outline-offset:4px}header{padding:25px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d4d7db}header strong{font-size:24px}header nav{display:flex;gap:30px}main{padding:55px 7%}h1{font-size:64px;line-height:1.16;letter-spacing:-.03em;margin:20px 0}h2{font-size:28px}p{color:#596578}.hero{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;padding:35px 0 70px}.hero p{max-width:420px;margin:25px 0}.sheet{background:white;border-radius:12px;padding:30px;box-shadow:0 20px 45px #00000012}.sheet h2{margin:0 0 22px;font-size:22px}.note-item{padding:15px 0;border-top:1px solid #e4e7e8}.note-item small{color:#718071}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;border-top:1px solid #cdd2d3;padding-top:30px}.features h3{font-size:20px}.mini-title{font-size:14px}footer{padding:24px 7%;border-top:1px solid #ccc;font-size:12px}.notice{font-size:12px;color:#66735f}.variant1{background:#e7ecd8;color:#243d2e}.variant1 header{border-color:#bdc9af}.variant1 button{background:#345840;border-radius:0}.variant1 h1{font-family:Georgia,"Songti SC",serif;font-size:78px;font-weight:500}.variant1 .sheet{border-radius:0;box-shadow:none;background:#faf9ec;transform:rotate(-2deg);padding:45px}.variant1 p{color:#52644b}.variant1 .hero{grid-template-columns:1.15fr 1fr}.variant2{background:#1e252b;color:#f4f3e9}.variant2 header{border-color:#505b60}.variant2 p{color:#b4c1c3}.variant2 button{background:#ee9678;color:#222b2e;border-radius:0}.variant2 h1{font-size:74px;font-weight:450}.variant2 .sheet{background:#35454b;border-radius:0;box-shadow:none}.variant2 .note-item{border-color:#596d71}.variant2 .note-item small{color:#bfcdbb}.variant2 .features{border-color:#505b60}.variant2 .notice{color:#c7cabb}.variant3{background:#f4ded5;color:#6c2d22}.variant3 button{background:#9c3c29;border-radius:30px}.variant3 p{color:#805c50}.variant3 h1{font-family:"Songti SC",Georgia,serif;font-size:76px;font-weight:500}.variant3 .sheet{border-radius:16px;background:#fff6ec;box-shadow:none}.variant3 .hero{grid-template-columns:1fr 1.1fr}.dashboard-head{display:flex;justify-content:space-between;align-items:center}select{padding:10px;background:transparent;color:inherit;border:1px solid #929d99;font:inherit}.summary{display:flex;gap:70px;padding:30px 0}.summary p{margin:0;font-size:14px}.summary strong{display:block;font-size:36px;font-weight:550}.chart{display:flex;gap:18px;height:170px;align-items:end;padding:20px 0;border-bottom:1px solid #bbc3ba}.bar{flex:1;background:#607c7b;border-radius:5px 5px 0 0;height:var(--height)}.variant1 .bar{background:#588250;border-radius:0}.variant2 .bar{background:#ed9678;border-radius:0}.variant3 .bar{background:#a95c4b}.chart-labels{display:flex;justify-content:space-around;margin:10px 0 30px;color:inherit;font-size:12px}.filters{display:flex;gap:10px;margin-bottom:20px}.filters button{background:transparent;color:inherit;border:1px solid #9fa6a2;padding:5px 16px}.filters button.active{background:#526d61;color:#fff}table{border-collapse:collapse;width:100%;text-align:left;font-size:15px}th,td{padding:14px;border-bottom:1px solid #9fa6a255}.dashboard-layout{display:grid;grid-template-columns:1.3fr 1fr;gap:45px}.project-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;margin-top:35px}.project{margin:0}.poster{height:270px;background:#d6ddce;display:flex;flex-direction:column;justify-content:center;padding:30px;color:#364637}.poster b{font-size:56px;font-family:Georgia,serif;font-weight:500}.poster span{font-size:15px}.poster.a{background:#cddde0;color:#194959}.poster.b{background:#dcd2b7;color:#785e2a}.poster.c{background:#dcbcaf;color:#744236}.variant2 .poster{background:#c88a6a;color:#242c30}.variant2 .poster.b{background:#aec3b3}.variant2 .poster.c{background:#a4bcc7}.variant1 .project-grid{grid-template-columns:1.3fr 1fr 1fr}.variant3 .poster{border-radius:80px 80px 0 0}.project figcaption{padding-top:15px}dialog{max-width:500px;background:inherit;color:inherit;border:1px solid #aaa;padding:30px}dialog::backdrop{background:#0008}dialog button{margin-top:20px}@media(max-width:700px){header{padding:20px;gap:20px}header nav{gap:12px;font-size:12px}header strong{font-size:20px}main{padding:25px 20px}.hero,.variant1 .hero,.variant3 .hero,.dashboard-layout{grid-template-columns:1fr;gap:28px}.hero{padding:0 0 35px}h1,.variant1 h1,.variant2 h1,.variant3 h1{font-size:44px}.features,.project-grid,.variant1 .project-grid{grid-template-columns:1fr;gap:20px}.summary{gap:25px}.summary strong{font-size:28px}.sheet{padding:20px}.variant1 .sheet{transform:none;padding:25px}.poster{height:230px}.dashboard-head{gap:10px}h2{font-size:23px}th,td{padding:10px 6px;font-size:12px}.summary p{font-size:12px}.chart{gap:10px}.notice{font-size:11px}.dashboard-layout{gap:30px}.filters{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><div id="app"></div><dialog id="detail"><h2 id="detail-title"></h2><p id="detail-content"></p><button id="close-dialog">关闭</button></dialog><script>
const params=new URLSearchParams(location.search);const variant=Math.max(0,Math.min(3,Number(params.get('variant'))||0));document.body.className=`variant${variant}`;const c=['money','folio'].includes(params.get('case'))?params.get('case'):'notes';
const foot='<footer><span class="notice">设计示意页面 · 非真实技能评测结果</span></footer>';
const header=(title,items)=>`<header><strong>${title}</strong><nav>${items}</nav></header>`;
const notes=header('拾页','<a href="#features">功能</a><a href="#start">开始使用</a>')+`<main><section class="hero"><div><span class="mini-title">灵感有处安放</span><h1>${variant===1?'让想法<br>慢慢长出来。':variant===2?'留住想法。<br>接着往前。':variant===3?'好想法，<br>值得被拾起。':'把灵感整理成<br>你的下一步。'}</h1><p>收集零散的念头，把笔记连接起来。<br>让每一次记录，都离行动更近一点。</p><button id="start" data-title="开始记录" data-content="这是交互示意。正式产品中的记录入口将连接到实际工作区。">开始记录</button></div><div class="sheet"><h2>周末，做一点喜欢的事</h2><p>留给自己的小小计划</p><div class="note-item">去逛街角的新书店<br><small>灵感收集 · 阅读</small></div><div class="note-item">整理上个月的照片<br><small>个人项目 · 进行中</small></div><div class="note-item">写下最近的三个想法<br><small>随手记 · 今天</small></div></div></section><section class="features" id="features"><div><h3>随手收集</h3><p>文字、链接与灵感，先留下来。</p></div><div><h3>连接想法</h3><p>让分散的记录找到彼此。</p></div><div><h3>继续行动</h3><p>从一条笔记，开始一个计划。</p></div></section></main>`+foot;
const money=header('日常账本','<a href="#transactions">交易明细</a>')+`<main><div class="dashboard-head"><div><h2>钱花在哪里，心里有数。</h2><p>你的收支概览 · 以下均为模拟数据</p></div><select aria-label="选择月份"><option>2026 年 9 月</option><option>2026 年 8 月</option></select></div><div class="summary"><div><p>收入</p><strong id="income">¥ 12,800</strong></div><div><p>支出</p><strong id="expense">¥ 4,260</strong></div><div><p>结余</p><strong id="balance">¥ 8,540</strong></div></div><div class="dashboard-layout"><section><h3>每周支出</h3><div class="chart">${[45,72,54,91,60,80].map(h=>`<div class="bar" style="--height:${h}%"></div>`).join('')}</div><div class="chart-labels"><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span></div></section><section><h3>支出分类</h3><div class="note-item">餐饮 <span style="float:right">¥ 1,680</span></div><div class="note-item">购物 <span style="float:right">¥ 1,220</span></div><div class="note-item">交通 <span style="float:right">¥ 680</span></div><div class="note-item">生活 <span style="float:right">¥ 680</span></div></section></div><section id="transactions"><h3>最近交易</h3><div class="filters">${['全部','餐饮','购物','交通'].map((v,i)=>`<button data-filter="${v}" class="${i===0?'active':''}">${v}</button>`).join('')}</div><table><thead><tr><th>项目</th><th>分类</th><th>日期</th><th>金额</th></tr></thead><tbody>${[['午间简餐','餐饮','09-18','− ¥ 38'],['书店购书','购物','09-17','− ¥ 126'],['地铁出行','交通','09-17','− ¥ 6'],['街角咖啡','餐饮','09-16','− ¥ 28']].map(r=>`<tr data-category="${r[1]}">${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></section></main>`+foot;
const folio=header('林间工作室','<a href="#works">作品</a><a href="#contact">联系</a>')+`<main><div><span class="mini-title">视觉设计 / 品牌 / 数字体验</span><h1>${variant===2?'把日常，<br>重新看一遍。':'用设计，<br>发现日常的另一面。'}</h1><p>你好，我是林间。关注品牌与数字体验，也喜欢在细节里寻找新的可能。</p></div><section class="project-grid" id="works">${[['a','FIELD','田野书店','品牌视觉'],['b','STILL','慢日咖啡','包装与平面'],['c','FORM','形间','数字体验']].map(([cls,en,name,tag])=>`<figure class="project"><a href="#" data-title="${name}" data-content="${name}的作品详情示意。这个入口用于演示独立页面里的可交互内容。"><div class="poster ${cls}"><span>${tag}</span><b>${en}</b><span>${name}</span></div></a><figcaption>${name} · ${tag}</figcaption></figure>`).join('')}</section><section id="contact" style="margin-top:50px"><h2>有个想法？一起聊聊。</h2><button data-title="联系工作室" data-content="这是联系入口示意，不会向任何人发送消息。">联系工作室</button></section></main>`+foot;
document.querySelector('#app').innerHTML=c==='money'?money:c==='folio'?folio:notes;
const dialog=document.querySelector('#detail');document.querySelectorAll('[data-title]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();document.querySelector('#detail-title').textContent=el.dataset.title;document.querySelector('#detail-content').textContent=el.dataset.content;dialog.showModal()}));document.querySelector('#close-dialog').onclick=()=>dialog.close();
document.querySelectorAll('[data-filter]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===btn));document.querySelectorAll('tbody tr').forEach(row=>row.hidden=btn.dataset.filter!=='全部'&&row.dataset.category!==btn.dataset.filter)});
document.querySelector('select')?.addEventListener('change',e=>{const old=e.target.selectedIndex===1;document.querySelector('#income').textContent=old?'¥ 11,600':'¥ 12,800';document.querySelector('#expense').textContent=old?'¥ 3,980':'¥ 4,260';document.querySelector('#balance').textContent=old?'¥ 7,620':'¥ 8,540';document.querySelectorAll('.bar').forEach((b,i)=>b.style.setProperty('--height',(old?[65,48,74,58,92,45]:[45,72,54,91,60,80])[i]+'%'));document.querySelectorAll('tbody td:nth-child(3)').forEach(td=>td.textContent=td.textContent.replace(old?'09-':'08-',old?'08-':'09-'))});
</script></body></html>
