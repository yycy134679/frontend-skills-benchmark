function initAudio(){try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.connect(audio.destination);updateVolume()}if(audio.state==='suspended')audio.resume()}catch(e){}}
function note(freq,when,dur,type='sine',level=.25){if(!audio||!master)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(level,when+.025);g.gain.exponentialRampToValueAtTime(.0001,when+dur);o.connect(g);g.connect(master);o.start(when);o.stop(when+dur+.02)}
function soundBeat(beat){if(!audio||audio.state!=='running')return;const t=audio.currentTime,root=tracks[index].root;const chords=[[0,4,7],[5,9,12],[7,11,14],[0,4,7]],chord=chords[Math.floor(beat/8)%4],step=beat%8;let semitone=chord[[0,1,2,1,0,2,1,2][step]]+root;note(220*Math.pow(2,semitone/12),t,.48,'sine',.19);if(step%2===0)note(110*Math.pow(2,(chord[0]+root)/12),t,.7,'triangle',.20);if(step===0||step===4)note(440*Math.pow(2,(chord[2]+root)/12),t,.8,'sine',.08)}
function setArm(a,instant=false){angle=a;els.arm.classList.toggle('dragging',instant);els.arm.style.transform=`rotate(${a}deg)`}
function armForTime(t){return 23*Math.max(0,Math.min(1,t/tracks[index].duration))}
function renderTrack(){const t=tracks[index];$('title').textContent=t.title;$('artist').textContent=t.artist;$('miniTitle').textContent=t.title;$('miniArtist').textContent=t.artist+' · 慢慢有光';$('duration').textContent=fmt(t.duration);document.querySelector('.album-index').textContent=String(index+1).padStart(2,'0')+' / 03';els.lyrics.innerHTML='';t.lyrics.forEach(([sec,line],i)=>{let b=document.createElement('button');b.className='lyric';b.textContent=line;b.addEventListener('click',()=>{seek(sec);startPlaying(true)});els.lyrics.appendChild(b)});activeLyric=-1;renderQueue();renderFavorite();updateTime(true)}
function renderQueue(){$('queueList').innerHTML='';tracks.forEach((t,i)=>{let b=document.createElement('button');b.className='queue-item'+(i===index?' current':'');if(i===index)b.setAttribute('aria-current','true');b.innerHTML=`<span class="qnum">${String(i+1).padStart(2,'0')}</span><span><strong>${t.title}</strong><small>${t.artist}</small></span><span class="qtime">${fmt(t.duration)}</span>`;b.addEventListener('click',()=>{changeTrack(i,true);closeQueue()});$('queueList').appendChild(b)})}
function renderFavorite(){const yes=favorites.includes(index);els.favorite.classList.toggle('active',yes);els.favorite.setAttribute('aria-pressed',yes);els.favorite.setAttribute('aria-label',yes?'取消收藏当前歌曲':'收藏当前歌曲')}
function updateTime(force=false){const t=tracks[index];$('currentTime').textContent=fmt(time);els.progress.value=Math.round(time/t.duration*1000);rangeFill(els.progress,time/t.duration*100);els.armSvg.setAttribute('aria-valuenow',Math.round(time/t.duration*100));els.armSvg.setAttribute('aria-valuetext',fmt(time)+' / '+fmt(t.duration));let next=-1;for(let i=0;i<t.lyrics.length;i++)if(time>=t.lyrics[i][0])next=i;if(next!==activeLyric||force){activeLyric=next;[...els.lyrics.children].forEach((x,i)=>x.classList.toggle('active',i===next));const line=els.lyrics.children[next];if(line)els.lyrics.scrollTo({top:Math.max(0,line.offsetTop-els.lyrics.offsetTop-55),behavior:reduced.matches?'auto':'smooth'})}if(!drag&&(playing||lowering))setArm(armForTime(time))}
function playIcon(){els.play.setAttribute('aria-label',playing||lowering?'暂停':'播放');els.play.innerHTML=playing||lowering?'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>'}
function startPlaying(immediate=false){initAudio();updateVolume();clearTimeout(lowerTimer);if(time>=tracks[index].duration)time=0;lastBeat=-1;if(immediate){lowering=false;playing=true;last=performance.now();setArm(armForTime(time));playIcon();return}playing=false;lowering=true;setArm(armForTime(time));playIcon();lowerTimer=setTimeout(()=>{if(!lowering)return;lowering=false;playing=true;last=performance.now();playIcon()},reduced.matches?0:1000)}
function pause(){clearTimeout(lowerTimer);lowering=false;playing=false;if(master&&audio)master.gain.setTargetAtTime(0,audio.currentTime,.02);setArm(-32);playIcon()}
function toggle(){if(playing||lowering)pause();else startPlaying()}
function seek(t){time=Math.max(0,Math.min(tracks[index].duration,t));lastBeat=-1;updateTime(true)}
function changeTrack(i,autoplay=true){clearTimeout(lowerTimer);lowering=false;playing=false;index=(i+tracks.length)%tracks.length;time=0;lastBeat=-1;renderTrack();if(autoplay)startPlaying(true);else{setArm(-32);playIcon()}}
function closeQueue(){els.queue.classList.remove('open');$('queueTrigger').setAttribute('aria-expanded','false')}
$('play').addEventListener('click',toggle);$('prev').addEventListener('click',()=>changeTrack(index-1,true));$('next').addEventListener('click',()=>changeTrack(index+1,true));els.repeat.addEventListener('click',()=>{repeat=!repeat;els.repeat.classList.toggle('active',repeat);els.repeat.setAttribute('aria-pressed',repeat);els.repeat.setAttribute('aria-label',repeat?'关闭单曲循环':'开启单曲循环')});els.favorite.addEventListener('click',()=>{favorites=favorites.includes(index)?favorites.filter(i=>i!==index):[...favorites,index];renderFavorite();save()});
els.progress.addEventListener('input',()=>seek(+els.progress.value/1000*tracks[index].duration));els.volume.addEventListener('input',()=>{volume=+els.volume.value;muted=false;updateVolume();save()});$('mute').addEventListener('click',()=>{muted=!muted;updateVolume();save()});$('queueTrigger').addEventListener('click',()=>{let open=!els.queue.classList.contains('open');els.queue.classList.toggle('open',open);$('queueTrigger').setAttribute('aria-expanded',open)});document.addEventListener('pointerdown',e=>{if(!$('queueWrap').contains(e.target))closeQueue()});
function pointerTime(e){let r=els.armSvg.getBoundingClientRect(),x=(e.clientX-r.left)*500/r.width,y=(e.clientY-r.top)*500/r.height;let deg=Math.atan2(y-65,x-420)*180/Math.PI-Math.atan2(235,-105)*180/Math.PI;return Math.max(0,Math.min(1,deg/23))*tracks[index].duration}
els.armSvg.addEventListener('pointerdown',e=>{if(!e.target.closest('.arm-hit'))return;e.preventDefault();if(lowering){pause();return}initAudio();drag={time,wasPlaying:playing||lowering,pointerId:e.pointerId};clearTimeout(lowerTimer);lowering=false;playing=false;els.armSvg.setPointerCapture(e.pointerId);els.preview.classList.add('show');let t=pointerTime(e);els.preview.textContent=fmt(t);setArm(armForTime(t),true);playIcon()});els.armSvg.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointerId)return;let t=pointerTime(e);els.preview.textContent=fmt(t);setArm(armForTime(t),true)});function finishDrag(e,cancel=false){if(!drag)return;let previous=drag;let t=cancel?previous.time:pointerTime(e);drag=null;els.preview.classList.remove('show');els.arm.classList.remove('dragging');seek(t);if(cancel&&!previous.wasPlaying){setArm(-32);playIcon()}else startPlaying(true)}els.armSvg.addEventListener('pointerup',e=>finishDrag(e));els.armSvg.addEventListener('pointercancel',e=>finishDrag(e,true));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(drag){finishDrag(e,true);return}closeQueue();return}const target=e.target;const isRange=target.tagName==='INPUT';if(target===els.armSvg&&(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();seek(time+((e.key==='ArrowRight'||e.key==='ArrowUp')?5:-5));if(!playing&&!lowering)startPlaying(true);return}if(isRange||target.tagName==='BUTTON')return;if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();seek(time+(e.key==='ArrowRight'?5:-5))}});
function tick(now){let dt=Math.min((now-last)/1000,.1);last=now;if(playing&&!drag){time+=dt;if(time>=tracks[index].duration){if(repeat){time=0;lastBeat=-1}else{changeTrack(index+1,true)}}let beat=Math.floor(time/.46);if(beat!==lastBeat){lastBeat=beat;soundBeat(beat)}updateTime()}const target=playing?1:0;speed+=(target-speed)*Math.min(1,dt*(playing?2.8:1.6));if(!reduced.matches){rotation=(rotation+dt*speed*100)%360;els.record.style.transform=`rotate(${rotation}deg)`}requestAnimationFrame(tick)}
renderTrack();updateVolume();setArm(-32,true);requestAnimationFrame(tick);
})();
</script>
