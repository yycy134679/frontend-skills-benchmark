function renderQueue(){const list=$('queueList');list.innerHTML='';tracks.forEach((t,i)=>{let b=document.createElement('button');b.className='queue-item'+(i===index?' current':'');b.innerHTML=`<span class="qnum">${i===index?'♫':String(i+1).padStart(2,'0')}</span><span class="qname">${t.title}</span><span class="qtime">${fmt(t.duration)}</span>`;if(i===index)b.setAttribute('aria-current','true');b.addEventListener('click',()=>{loadTrack(i,true);closeQueue()});list.appendChild(b)})}
function renderLike(){let on=!!likes[index];$('like').classList.toggle('liked',on);$('like').setAttribute('aria-pressed',on);$('like').setAttribute('aria-label',on?'取消收藏':'收藏这首歌')}
function renderVolume(){vol.value=volume;fillRange(vol,muted?0:volume);$('mute').innerHTML=muted||volume===0?'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM17 9l4 6M21 9l-4 6"/></svg>':'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>';$('mute').setAttribute('aria-label',muted?'取消静音':'静音');setGain()}
function update(){let track=tracks[index];$('currentTime').textContent=fmt(time);progress.value=Math.round(time/track.duration*1000);fillRange(progress,time/track.duration*100);setArm();let line=0;for(let i=0;i<track.lyrics.length;i++){if(time>=track.lyrics[i][0])line=i;else break}if(line!==activeLine){activeLine=line;[...lyrics.children].forEach((el,i)=>{el.classList.toggle('active',i===line);if(i===line)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});let el=lyrics.children[line];if(el)lyrics.scrollTo({top:Math.max(0,el.offsetTop-lyrics.offsetTop-lyrics.clientHeight*.36),behavior:reduced.matches?'auto':'smooth'})}}
function frame(now){let dt=Math.min((now-lastFrame)/1000,.1);lastFrame=now;if(playing&&!drag){time+=dt;if(time>=tracks[index].duration){if(repeat){time=0;lastScheduled=-1}else{loadTrack(index+1,true)}}if(playing){let step=Math.floor(time/(60/tracks[index].tempo/2));if(step!==lastScheduled){lastScheduled=step;synthNote(time,tracks[index])}update()}}let target=playing&&!drag&&!reduced.matches?1:0;speed+=(target-speed)*Math.min(1,dt*(target?2:1.6));if(reduced.matches)speed=0;rotation=(rotation+speed*dt*33)%360;record.style.transform=`rotate(${rotation}deg)`;requestAnimationFrame(frame)}
$('play').addEventListener('click',toggle);$('prev').addEventListener('click',()=>loadTrack(index-1,true));$('next').addEventListener('click',()=>loadTrack(index+1,true));$('repeat').addEventListener('click',()=>{repeat=!repeat;$('repeat').classList.toggle('on',repeat);$('repeat').setAttribute('aria-pressed',repeat);$('repeat').setAttribute('aria-label',repeat?'关闭单曲循环':'开启单曲循环')});progress.addEventListener('input',()=>seek(+progress.value/1000*tracks[index].duration));vol.addEventListener('input',()=>{volume=+vol.value;muted=false;renderVolume();save()});$('mute').addEventListener('click',()=>{muted=!muted;renderVolume();save()});$('like').addEventListener('click',()=>{likes[index]=!likes[index];renderLike();save()});
const queue=$('queuePanel');function closeQueue(){queue.classList.remove('open');$('queueButton').setAttribute('aria-expanded','false');$('queueButton').setAttribute('aria-label','打开播放队列')}$('queueButton').addEventListener('click',()=>{let open=queue.classList.toggle('open');$('queueButton').setAttribute('aria-expanded',open);$('queueButton').setAttribute('aria-label',open?'关闭播放队列':'打开播放队列')});document.addEventListener('pointerdown',e=>{if(!e.target.closest('.queue-wrap'))closeQueue()});
function dragAt(e){const r=$('turntable').getBoundingClientRect(),x=r.left+r.width*.78,y=r.top+r.height*.08;let angle=Math.atan2(-(e.clientX-x),e.clientY-y)*180/Math.PI;angle=Math.max(24,Math.min(48,angle));drag.value=(angle-24)/24*tracks[index].duration;arm.style.transform=`translateX(-50%) rotate(${angle}deg)`;$('preview').textContent=fmt(drag.value);$('preview').classList.add('show');arm.setAttribute('aria-valuenow',Math.round(drag.value/tracks[index].duration*100));arm.setAttribute('aria-valuetext',fmt(drag.value)+' / '+fmt(tracks[index].duration))}
arm.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();drag={value:time,wasPlaying:playing||lowering,original:time,pointer:e.pointerId};clearTimeout(lowerTimer);lowering=false;playing=false;setGain();renderPlay();arm.classList.add('dragging');arm.setPointerCapture(e.pointerId);dragAt(e)});arm.addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.pointer)dragAt(e)});function endDrag(cancel=false){if(!drag)return;let d=drag;drag=null;arm.classList.remove('dragging');$('preview').classList.remove('show');seek(cancel?d.original:d.value);if(!cancel||d.wasPlaying)start();else setArm()}arm.addEventListener('pointerup',e=>{if(drag&&e.pointerId===drag.pointer)endDrag(false)});arm.addEventListener('pointercancel',()=>endDrag(true));
arm.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowDown','ArrowRight','ArrowUp'].includes(e.key)){e.preventDefault();e.stopPropagation();seek(time+(['ArrowRight','ArrowUp'].includes(e.key)?5:-5),true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(drag){endDrag(true);return}closeQueue();return}if(e.target.matches('input,button')||e.target===arm)return;if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();seek(time+(e.key==='ArrowRight'?5:-5))}});
renderVolume();loadTrack(0,false);requestAnimationFrame(frame);
</script>
</body>
</html>
