function fill(input,percent){input.style.setProperty('--fill',Math.max(0,Math.min(100,percent))+'%')}
function initAudio(){if(!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)();gain=audio.createGain();gain.connect(audio.destination);updateVolume()}catch(e){return}}if(audio.state==='suspended')audio.resume();nextNote=audio.currentTime;noteIndex=Math.floor(position/0.48)}
function updateVolume(){els.volume.value=volume;fill(els.volume,volume);if(gain&&audio)gain.gain.setTargetAtTime(muted||!playing?0:volume/100*.22,audio.currentTime,.04);els.mute.setAttribute('aria-label',muted||volume===0?'取消静音':'静音');els.mute.innerHTML=muted||volume===0?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4zM17 9l4 6m0-6-4 6"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>'}
function scheduleAudio(){if(!audio||!gain||!playing)return; if(nextNote<audio.currentTime-.1)nextNote=audio.currentTime;while(nextNote<audio.currentTime+.15){const seq=tracks[track].notes;let degree=seq[noteIndex%seq.length];let freq=220*Math.pow(2,degree/12);tone(freq,nextNote,.44,.20,'sine');if(noteIndex%4===0)tone(freq/2,nextNote,1.8,.13,'triangle');if(noteIndex%8===0)tone(freq*1.5,nextNote,1.4,.07,'sine');noteIndex++;nextNote+=.48}}
function tone(freq,start,duration,level,type){let osc=audio.createOscillator(), envelope=audio.createGain();osc.type=type;osc.frequency.value=freq;envelope.gain.setValueAtTime(.0001,start);envelope.gain.exponentialRampToValueAtTime(level,start+.04);envelope.gain.exponentialRampToValueAtTime(.0001,start+duration);osc.connect(envelope);envelope.connect(gain);osc.start(start);osc.stop(start+duration+.02)}
function armAngle(){return -4+(position/tracks[track].duration)*32}function setArm(angle){els.arm.setAttribute('transform',`rotate(${angle} 505 65)`)}
function updateArm(){if(!dragging)setArm(playing||dropping?armAngle():-20);els.arm.setAttribute('aria-valuenow',Math.round(position/tracks[track].duration*100));els.arm.setAttribute('aria-valuetext',fmt(position)+' / '+fmt(tracks[track].duration))}
function updateFavorite(){let on=!!favorites[track];els.favorite.classList.toggle('active',on);els.favorite.setAttribute('aria-pressed',on);els.favorite.setAttribute('aria-label',on?'取消收藏':'收藏这首歌');els.favorite.querySelector('svg').setAttribute('fill',on?'currentColor':'none')}
function renderLyrics(){els.lyrics.innerHTML='';tracks[track].lyrics.forEach(([time,text],i)=>{let b=document.createElement('button');b.className='lyric';b.textContent=text;b.dataset.index=i;b.addEventListener('click',()=>{seek(time);start()});els.lyrics.appendChild(b)});activeLyric=-1;updateLyrics(true)}
function updateLyrics(force=false){let lines=tracks[track].lyrics,i=0;for(let j=0;j<lines.length;j++)if(position>=lines[j][0])i=j;if(i!==activeLyric||force){activeLyric=i;[...els.lyrics.children].forEach((el,n)=>el.classList.toggle('active',n===i));let el=els.lyrics.children[i];if(el)els.lyrics.scrollTo({top:Math.max(0,el.offsetTop-els.lyrics.offsetTop-70),behavior:reduced.matches?'auto':'smooth'})}}
function renderQueue(){els.queueTracks.innerHTML='';tracks.forEach((t,i)=>{let b=document.createElement('button');b.className='queue-track'+(i===track?' current':'');b.innerHTML=`<span class="queue-num">${String(i+1).padStart(2,'0')}</span><span class="queue-name">${t.title}</span><span class="queue-duration">${fmt(t.duration)}</span>`;if(i===track)b.setAttribute('aria-current','true');b.addEventListener('click',()=>{changeTrack(i,true);closeQueue()});els.queueTracks.appendChild(b)})}
function renderTrack(){let t=tracks[track];$('title').textContent=t.title;$('nowName').textContent=t.title;$('trackNumber').textContent=String(track+1).padStart(2,'0');els.duration.textContent=fmt(t.duration);renderLyrics();renderQueue();updateFavorite();updateProgress()}
function updateProgress(){els.current.textContent=fmt(position);els.progress.value=Math.round(position/tracks[track].duration*1000);fill(els.progress,position/tracks[track].duration*100);updateArm();updateLyrics()}
function updatePlay(){els.play.innerHTML=playing||dropping?pauseIcon:playIcon;els.play.setAttribute('aria-label',playing||dropping?'暂停':'播放')}
function cancelDrop(){clearTimeout(dropTimer);dropTimer=null;dropping=false}
function start(){if(playing||dropping)return;if(position>=tracks[track].duration)position=0;initAudio();dropping=true;updatePlay();updateArm();dropTimer=setTimeout(()=>{dropping=false;playing=true;if(audio){nextNote=audio.currentTime;noteIndex=Math.floor(position/.48)}updateVolume();updatePlay();updateArm()},reduced.matches?0:800)}
function pause(){cancelDrop();playing=false;updateVolume();updatePlay();updateArm()}
function toggle(){playing||dropping?pause():start()}
function seek(value){position=Math.max(0,Math.min(tracks[track].duration,value));if(audio){nextNote=audio.currentTime;noteIndex=Math.floor(position/.48)}updateProgress()}
function changeTrack(i,autoplay){cancelDrop();playing=false;updateVolume();track=(i+tracks.length)%tracks.length;position=0;renderTrack();updatePlay();if(autoplay)start();else updateArm()}
function closeQueue(){els.queue.hidden=true;els.queueButton.setAttribute('aria-expanded','false')}
function toggleQueue(){els.queue.hidden=!els.queue.hidden;els.queueButton.setAttribute('aria-expanded',String(!els.queue.hidden))}
function dragAngle(e){let rect=els.stage.getBoundingClientRect();let x=(e.clientX-rect.left)*600/rect.width,y=(e.clientY-rect.top)*500/rect.height;let angle=Math.atan2(y-65,x-505)*180/Math.PI;return Math.max(-4,Math.min(28,angle-104.3))}
function dragMove(e){if(!dragging||e.pointerId!==dragging.id)return;let angle=dragAngle(e);dragging.position=(angle+4)/32*tracks[track].duration;setArm(angle);els.preview.textContent=fmt(dragging.position);els.preview.classList.add('visible');els.arm.setAttribute('aria-valuenow',Math.round(dragging.position/tracks[track].duration*100));els.arm.setAttribute('aria-valuetext',fmt(dragging.position))}
function finishDrag(cancel){if(!dragging)return;let d=dragging;dragging=null;els.arm.classList.remove('dragging');els.preview.classList.remove('visible');if(cancel){position=d.oldPosition;if(d.wasPlaying)start();else updateProgress()}else{seek(d.position);start()}updateProgress()}
els.arm.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();let wasPlaying=playing||dropping;let oldPosition=position;pause();dragging={id:e.pointerId,oldPosition,position:oldPosition,wasPlaying};els.arm.classList.add('dragging');els.arm.setPointerCapture(e.pointerId);dragMove(e)});els.arm.addEventListener('pointermove',dragMove);els.arm.addEventListener('pointerup',e=>{if(dragging&&e.pointerId===dragging.id)finishDrag(false)});els.arm.addEventListener('pointercancel',()=>finishDrag(true));els.arm.addEventListener('lostpointercapture',()=>{if(dragging)finishDrag(true)});
els.arm.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowDown','ArrowRight','ArrowUp'].includes(e.key)){e.preventDefault();e.stopPropagation();seek(position+(['ArrowRight','ArrowUp'].includes(e.key)?5:-5));if(!playing&&!dropping){setArm(armAngle());els.preview.textContent=fmt(position);els.preview.classList.add('visible');clearTimeout(els.arm.hintTimer);els.arm.hintTimer=setTimeout(()=>{els.preview.classList.remove('visible');updateArm()},1200)}}});
els.play.addEventListener('click',toggle);$('lift').addEventListener('click',pause);$('prev').addEventListener('click',()=>changeTrack(track-1,true));$('next').addEventListener('click',()=>changeTrack(track+1,true));els.repeat.addEventListener('click',()=>{repeat=!repeat;els.repeat.classList.toggle('on',repeat);els.repeat.setAttribute('aria-pressed',repeat);els.repeat.setAttribute('aria-label',repeat?'关闭单曲循环':'开启单曲循环')});els.progress.addEventListener('input',()=>seek(Number(els.progress.value)/1000*tracks[track].duration));els.volume.addEventListener('input',()=>{volume=Number(els.volume.value);muted=false;updateVolume();save()});els.mute.addEventListener('click',()=>{muted=!muted;if(!muted&&volume===0)volume=65;updateVolume();save()});els.favorite.addEventListener('click',()=>{favorites[track]=!favorites[track];updateFavorite();save()});els.queueButton.addEventListener('click',toggleQueue);$('moreQueue').addEventListener('click',toggleQueue);document.addEventListener('pointerdown',e=>{if(!els.queue.hidden&&!$('queueWrap').contains(e.target)&&!$('moreQueue').contains(e.target))closeQueue()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(dragging){finishDrag(true);e.preventDefault()}else if(!els.queue.hidden){closeQueue();els.queueButton.focus()}return}let target=e.target;if(target.matches('input,[role="slider"]')||target.isContentEditable)return;if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();seek(position+(e.key==='ArrowRight'?5:-5))}});
function tick(now){let dt=Math.min((now-lastFrame)/1000,.1);lastFrame=now;if(playing){position+=dt;if(position>=tracks[track].duration){if(repeat){position=0;if(audio){nextNote=audio.currentTime;noteIndex=0}}else changeTrack(track+1,true)}scheduleAudio();updateProgress()}let target=playing&&!reduced.matches?1:0;speed+=(target-speed)*Math.min(1,dt*(target?1.8:1.2));if(reduced.matches)speed=0;rotation=(rotation+speed*dt*24)%360;els.record.style.transform=`rotate(${rotation}deg)`;requestAnimationFrame(tick)}
updateVolume();renderTrack();updatePlay();requestAnimationFrame(tick);
})();
</script>
</body>
