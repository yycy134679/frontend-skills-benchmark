function lift(){pause();setArm(-8,'rest')}
function toggle(){if(playing||landing){if(landing)lift();else pause()}else if(angle<0)begin();else{setupAudio();playing=true;lastNote=-1;lastFrame=performance.now();setPlayingUI()}}
function seek(value,shouldPlay=false){time=Math.min(track().duration,Math.max(0,value));lastNote=-1;if(angle>=0&&!drag)setArm(positionAngle());renderTime();if(shouldPlay){if(landing)clearTimeout(landingTimer);landing=false;setupAudio();playing=true;lastFrame=performance.now();setArm(positionAngle());setPlayingUI()}}
function load(i,autoplay=true){pause();index=(i+tracks.length)%tracks.length;time=0;lastLyric=-1;el.title.textContent=track().title;el.artist.textContent=track().artist;el.duration.textContent=fmt(track().duration);el.lyrics.replaceChildren(...track().lyrics.map(([at,text])=>{const b=document.createElement('button');b.className='lyric';b.textContent=text;b.addEventListener('click',()=>seek(at,true));return b}));renderFavorites();renderQueue();renderTime();if(autoplay){if(angle<0)begin();else{setupAudio();playing=true;lastFrame=performance.now();setArm(positionAngle());setPlayingUI()}}else setArm(-8,'rest')}
function renderFavorites(){const yes=favorites.includes(index);el.favorite.classList.toggle('active',yes);el.favorite.setAttribute('aria-pressed',String(yes));el.favorite.setAttribute('aria-label',yes?'取消收藏当前歌曲':'收藏当前歌曲')}
function renderQueue(){el.queueItems.replaceChildren(...tracks.map((tr,i)=>{let b=document.createElement('button');b.className='queue-item'+(i===index?' current':'');b.innerHTML=`<small>${String(i+1).padStart(2,'0')}</small><b>${tr.title}</b><small>${i===index?'正在播放':fmt(tr.duration)}</small>`;b.addEventListener('click',()=>{load(i,true);closeQueue()});return b}))}
function closeQueue(){el.queue.hidden=true;el.queueToggle.setAttribute('aria-expanded','false');el.queueToggle.setAttribute('aria-label','打开播放队列')}
function renderTime(){el.current.textContent=fmt(time);el.progress.value=Math.round(time/track().duration*1000);fill(el.progress,time/track().duration*100);el.arm.setAttribute('aria-valuenow',String(Math.round(time/track().duration*100)));el.arm.setAttribute('aria-valuetext',fmt(time)+' / '+fmt(track().duration));let active=0;track().lyrics.forEach(([t],i)=>{if(time>=t)active=i});if(active!==lastLyric){const children=el.lyrics.children;if(lastLyric>=0&&children[lastLyric])children[lastLyric].classList.remove('active');if(children[active]){children[active].classList.add('active');children[active].scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}lastLyric=active}}
function frame(now){let dt=Math.min((now-lastFrame)/1000,.1);lastFrame=now;if(playing&&!drag){time+=dt;if(time>=track().duration){if(repeat){time=0;lastNote=-1}else{load(index+1,true)}}if(playing){let step=Math.floor(time/(60/track().tempo/2));if(step!==lastNote){lastNote=step;soundNote(step)}setArm(positionAngle());renderTime()}}const target=playing?1:0;speed+=(target-speed)*Math.min(1,dt*(playing?1.8:1.1));if(!matchMedia('(prefers-reduced-motion: reduce)').matches){rotation=(rotation+speed*dt*115)%360;el.record.style.transform=`rotate(${rotation}deg)`}else el.record.style.transform='none';requestAnimationFrame(frame)}
el.play.addEventListener('click',toggle);$('lift').addEventListener('click',lift);$('prev').addEventListener('click',()=>load(index-1,true));$('next').addEventListener('click',()=>load(index+1,true));el.repeat.addEventListener('click',()=>{repeat=!repeat;el.repeat.classList.toggle('active',repeat);el.repeat.setAttribute('aria-pressed',String(repeat));el.repeat.setAttribute('aria-label',repeat?'关闭单曲循环':'开启单曲循环')});el.favorite.addEventListener('click',()=>{favorites=favorites.includes(index)?favorites.filter(i=>i!==index):[...favorites,index];storage.set('vinyl-favorites',favorites);renderFavorites()});el.progress.addEventListener('input',()=>seek(Number(el.progress.value)/1000*track().duration));el.volume.addEventListener('input',()=>{volume=Number(el.volume.value);muted=false;storage.set('vinyl-muted',muted);storage.set('vinyl-volume',volume);updateVolume()});el.mute.addEventListener('click',()=>{muted=!muted;storage.set('vinyl-muted',muted);updateVolume()});el.queueToggle.addEventListener('click',()=>{let open=el.queue.hidden;el.queue.hidden=!open;el.queueToggle.setAttribute('aria-expanded',String(open));el.queueToggle.setAttribute('aria-label',open?'关闭播放队列':'打开播放队列')});document.addEventListener('pointerdown',e=>{if(!e.target.closest('#queueWrap'))closeQueue()});
function dragMove(e){if(!drag)return;const rect=el.deck.getBoundingClientRect(),x=rect.left+rect.width*.82,y=rect.top+rect.height*.12;let a=Math.atan2(x-e.clientX,e.clientY-y)*180/Math.PI;a=Math.max(17,Math.min(38,a));let t=(a-17)/21*track().duration;drag.preview=t;setArm(a);el.preview.textContent=fmt(t);el.preview.classList.add('show')}
el.arm.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();el.arm.setPointerCapture(e.pointerId);drag={time,angle,wasPlaying:playing,wasLanding:landing,preview:time};pause();el.arm.classList.add('dragging');dragMove(e)});el.arm.addEventListener('pointermove',dragMove);function finishDrag(cancel){if(!drag)return;let d=drag;drag=null;el.arm.classList.remove('dragging');el.preview.classList.remove('show');if(cancel){time=d.time;setArm(d.angle,d.angle<0?'rest':'');renderTime();if(d.wasLanding)begin();else if(d.wasPlaying){setupAudio();playing=true;lastFrame=performance.now();setPlayingUI()}}else seek(d.preview,true)}el.arm.addEventListener('pointerup',()=>finishDrag(false));el.arm.addEventListener('pointercancel',()=>finishDrag(true));el.arm.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowDown','ArrowRight','ArrowUp'].includes(e.key)){e.preventDefault();e.stopPropagation();seek(time+(['ArrowLeft','ArrowDown'].includes(e.key)?-5:5),true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(drag){finishDrag(true);return}if(!el.queue.hidden){closeQueue();el.queueToggle.focus();return}if(landing){lift();return}}if(e.target.matches('input,button,[role=slider]'))return;if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();seek(time+(e.key==='ArrowLeft'?-5:5))}});
updateVolume();load(0,false);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
