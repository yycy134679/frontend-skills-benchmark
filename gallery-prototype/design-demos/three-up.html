<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>三个方向</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #262624; color: #f2efe6; font-family: "PingFang SC", "Helvetica Neue", sans-serif; padding: 24px; }
  .row { display: flex; gap: 20px; }
  .item { width: 460px; }
  .item img { display: block; width: 460px; height: 288px; object-fit: cover; object-position: top center; border: 1px solid #4a4a45; }
  .cap { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 12px; color: #b9b6ac; }
  .cap b { color: #f2efe6; font-size: 13px; font-weight: 600; }
  .desc { margin-top: 4px; font-size: 12px; line-height: 1.7; color: #a7a49a; }
</style>
</head>
<body>
<div class="row">
  <div class="item">
    <img src="dir-1.png" alt="签名册方向首屏">
    <div class="cap"><b>A · 签名册</b><span>暖纸 / 衬线 / 绿色章首</span></div>
    <p class="desc">像一本逐件翻看的对照册，图版探出版心。</p>
  </div>
  <div class="item">
    <img src="dir-2.png" alt="索引标本方向首屏">
    <div class="cap"><b>B · 索引标本</b><span>纯白 / 网格 / 超大编号</span></div>
    <p class="desc">像一张把变量摊开的标本表，规则线分栏。</p>
  </div>
  <div class="item">
    <img src="dir-3.png" alt="招牌墙方向首屏">
    <div class="cap"><b>C · 招牌墙</b><span>深色 / 彩色招牌 / 层叠窗口</span></div>
    <p class="desc">像一面挂满结果的街墙，每个技能一块招牌。</p>
  </div>
</div>
</body>
</html>
